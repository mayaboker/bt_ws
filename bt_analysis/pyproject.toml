[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-analysis"
version = "0.1.0"
description = "Read-only web dashboard for BT flight blackbox logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2",
    "pyarrow>=17",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
    "setuptools>=68",
]

[project.scripts]
bt-analysis = "bt_analysis.main:main"

[tool.setuptools.package-data]
bt_analysis = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bt_analysis*"]
