---
- name: Configure Raspberry Pi image
  hosts: robot_image
  gather_facts: true

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Create robot user
      ansible.builtin.user:
        name: user
        password: "{{ 'user' | password_hash('sha512', 'robotuser') }}"
        home: /home/user
        create_home: true
        shell: /bin/bash
        state: present

    - name: Add robot user to device access groups
      ansible.builtin.user:
        name: user
        groups:
          - video
          - dialout
          - plugdev
        append: true
        state: present

    - name: Allow robot user to run all sudo commands
      ansible.builtin.copy:
        dest: /etc/sudoers.d/user
        owner: root
        group: root
        mode: "0440"
        content: |
          user ALL=(ALL:ALL) ALL
        validate: "visudo -cf %s"
      tags:
        - sudoers
        - suders

    - name: Clean apt package archives
      ansible.builtin.apt:
        clean: true

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install robot packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - cmake
          - curl
          - build-essential
          - ffmpeg
          - gobject-introspection
          - tmux
          - htop
          - libcairo2-dev
          - libgl1
          - libglib2.0-0
          - libglib2.0-dev
          - libgirepository1.0-dev
          - libsm6
          - libxext6
          - libxrender1
          - libxml2-dev
          - libxslt1-dev
          - libzmq3-dev
          - meson
          - ninja-build
          - openssh-server
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - pkg-config
          - tmuxp
          - vim
          - zlib1g-dev
        state: present

    - name: Install global tmux config
      ansible.builtin.copy:
        src: files/tmux.conf
        dest: /etc/tmux.conf
        owner: root
        group: root
        mode: "0644"
      tags:
        - tmux

    - name: Install GStreamer, Python bindings, and H264 H265 support
      ansible.builtin.apt:
        name:
          - gir1.2-gst-plugins-base-1.0
          - gir1.2-gstreamer-1.0
          - gstreamer1.0-gl
          - gstreamer1.0-libav
          - gstreamer1.0-plugins-bad
          - gstreamer1.0-plugins-base
          - gstreamer1.0-plugins-good
          - gstreamer1.0-plugins-ugly
          - gstreamer1.0-tools
          - gstreamer1.0-x
          - python3-gi
          - python3-gst-1.0
        state: present

    - name: Install debug and network diagnostic tools
      ansible.builtin.apt:
        autoclean: true
        name:
          - iftop
          - iperf3
          - iproute2
          - iputils-ping
          - lsof
          - net-tools
          - strace
          - tcpdump
        state: present

    - name: Clean apt package archives after debug tool install
      ansible.builtin.apt:
        clean: true

    - name: Install hotspot network packages
      ansible.builtin.apt:
        autoclean: true
        name:
          - dnsmasq
          - netplan.io
          - network-manager
          - wpasupplicant
        state: present

    - name: Clean apt package archives after hotspot package install
      ansible.builtin.apt:
        clean: true

    - name: Configure wlan0 as jarvis hotspot with netplan
      ansible.builtin.copy:
        dest: /etc/netplan/90-jarvis-hotspot.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            renderer: NetworkManager
            wifis:
              wlan0:
                dhcp4: false
                dhcp6: false
                addresses:
                  - 192.168.1.1/24
                access-points:
                  "jarvis":
                    mode: ap

    - name: Configure DHCP for jarvis hotspot clients
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/jarvis-hotspot.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          interface=wlan0
          bind-interfaces
          dhcp-range=192.168.1.50,192.168.1.150,255.255.255.0,12h
          dhcp-option=3,192.168.1.1
          dhcp-option=6,192.168.1.1

    - name: Install SSH public key for user
      ansible.posix.authorized_key:
        user: user
        state: present
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC+cr27OxEUbO11/Zx/iRhHNhg+wfVQRfQp86GkoFvgO user@dev1

    - name: Create SSH server config directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable SSH password and key login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/robot.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication yes
          PubkeyAuthentication yes
          PermitRootLogin no

    - name: Download uv installer
      ansible.builtin.get_url:
        url: https://astral.sh/uv/install.sh
        dest: /tmp/uv-install.sh
        mode: "0755"

    - name: Remove old root uv install
      ansible.builtin.file:
        path: /usr/local/bin/uv
        state: absent

    - name: Create user uv directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: user
        group: user
        mode: "0755"
      loop:
        - /home/user/.local
        - /home/user/.local/bin
        - /home/user/.cache
        - /home/user/.cache/uv

    - name: Install uv
      ansible.builtin.command:
        cmd: >
          runuser -u user --
          env HOME=/home/user UV_INSTALL_DIR=/home/user/.local/bin
          sh /tmp/uv-install.sh
        creates: /home/user/.local/bin/uv
      environment:
        HOME: /home/user
        UV_INSTALL_DIR: /home/user/.local/bin

    - name: Create user Python environment
      ansible.builtin.command:
        cmd: >
          runuser -u user --
          env HOME=/home/user
          /home/user/.local/bin/uv venv --system-site-packages /home/user/.venv
        creates: /home/user/.venv/bin/python
      environment:
        HOME: /home/user

    - name: Set user Python environment ownership
      ansible.builtin.file:
        path: /home/user/.venv
        state: directory
        owner: user
        group: user
        recurse: true

    - name: Install bt_app Python dependencies into user environment
      ansible.builtin.command:
        cmd: >
          runuser -u user --
          env HOME=/home/user
          /home/user/.local/bin/uv pip install
          --python /home/user/.venv/bin/python
          loguru
          click
          numpy
          opencv-python
          transitions
          pyserial
          pyyaml
          pyzmq
          msgpack
          'pymavlink>=2.4.49'
      register: bt_app_python_dependencies
      changed_when: >
        'Installed' in bt_app_python_dependencies.stdout
        or 'Installed' in bt_app_python_dependencies.stderr
        or 'Updated' in bt_app_python_dependencies.stdout
        or 'Updated' in bt_app_python_dependencies.stderr
        or 'Uninstalled' in bt_app_python_dependencies.stdout
        or 'Uninstalled' in bt_app_python_dependencies.stderr
      environment:
        HOME: /home/user

    - name: Install bt_record Python dependencies into user environment
      ansible.builtin.command:
        cmd: >
          runuser -u user --
          env HOME=/home/user
          /home/user/.local/bin/uv pip install
          --python /home/user/.venv/bin/python
          fastapi
          loguru
          pyyaml
          uvicorn
      register: bt_record_python_dependencies
      changed_when: >
        'Installed' in bt_record_python_dependencies.stdout
        or 'Installed' in bt_record_python_dependencies.stderr
        or 'Updated' in bt_record_python_dependencies.stdout
        or 'Updated' in bt_record_python_dependencies.stderr
        or 'Uninstalled' in bt_record_python_dependencies.stdout
        or 'Uninstalled' in bt_record_python_dependencies.stderr
      environment:
        HOME: /home/user

    - name: Set user Python environment ownership after dependency install
      ansible.builtin.file:
        path: /home/user/.venv
        state: directory
        owner: user
        group: user
        recurse: true

    - name: Set user uv cache ownership
      ansible.builtin.file:
        path: /home/user/.cache/uv
        state: directory
        owner: user
        group: user
        recurse: true

    - name: Add user Python environment to login shell
      ansible.builtin.blockinfile:
        path: /home/user/.profile
        create: true
        owner: user
        group: user
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - user python environment"
        block: |
          export VIRTUAL_ENV=/home/user/.venv
          export PATH="/home/user/.local/bin:$PATH"
          export PATH="$VIRTUAL_ENV/bin:$PATH"

    - name: Add user command aliases
      ansible.builtin.blockinfile:
        path: /home/user/.bash_aliases
        create: true
        owner: user
        group: user
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - user aliases"
        block: |
          alias py='/home/user/.venv/bin/python'
          alias uvpip='/home/user/.local/bin/uv pip --python /home/user/.venv/bin/python'
          alias bt-app='/home/user/.venv/bin/bt-app'
          alias bt-gz-camera='/home/user/.venv/bin/bt-gz-camera'
          alias bt-optical-flow-tracker='/home/user/.venv/bin/bt-optical-flow-tracker'
          alias bt-gz-rtf='/home/user/.venv/bin/bt-gz-rtf'
