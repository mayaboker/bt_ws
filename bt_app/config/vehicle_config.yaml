# Whether an external pilot/controller is expected to provide manual input.
has_external_pilot: true

# FCU connection type. Use 1 for serial and 2 for ethernet.
drone_sink: 2

# Ethernet host/IP for the FCU when drone_sink is ethernet.
drone_eth_host: "127.0.0.1"

# Ethernet port for the FCU when drone_sink is ethernet.
drone_eth_port: 5761

# Serial device path for the FCU when drone_sink is serial.
drone_serial_port: "/dev/ttyUSB0"

# Ground control station MAVLink destination.
gcs_ip: "127.0.0.1"
gcs_port: 14550

# Optional non-blocking RC/state recorder.
rc_record_enabled: true
rc_record_path: "logs/rc_state.csv"
rc_record_flush_interval_s: 1.0
rc_record_queue_size: 1000

# Parameter YAML filename under bt_app/config.
config_name: "parameters.yaml"

# Diagnostic log verbosity. One of TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL.
log_level: "INFO"

# Observe bt_gst red-detection telemetry without sending flight commands.
visual_observer_enabled: true
visual_zmq_endpoint: "tcp://127.0.0.1:5556"
visual_image_width: 640
visual_image_height: 480
# Gazebo pinhole camera matrix. For a 640 px image and 90-degree horizontal
# FOV, fx = 640 / (2 * tan(90deg / 2)) = 320 px; square pixels give fy=320.
visual_camera_fx_px: 320.0
visual_camera_fy_px: 320.0
visual_camera_cx_px: 320.0
visual_camera_cy_px: 240.0
# Physical dimensions of the complete planar red target face.
visual_target_width_m: 1.0
visual_target_height_m: 1.0
visual_print_rate_hz: 2.0
visual_mavlink_rate_hz: 20.0

# Pre-tracking cursor and result-gating settings.
tracker_request_endpoint: "tcp://127.0.0.1:5555"
tracker_initial_x: 320
tracker_initial_y: 240
tracker_adjust_step_x_px: 5
tracker_adjust_step_y_px: 3
tracker_adjust_rate_hz: 5.0
tracker_adjust_deadband_pwm: 100
tracker_bridge_health_timeout_s: 1.0
tracker_result_timeout_s: 0.25

# Milestone-1 visual glide geometry. These values do not command RC yet.
glide_target_speed_m_s: 5.0
glide_max_vertical_speed_m_s: 3.0
glide_center_deadband: 0.05
glide_center_error_max: 0.99
glide_lock_frame_count: 2
glide_commit_depth_m: 1.0
glide_commit_timeout_s: 2.0
glide_log_enabled: true
glide_log_path: "logs/glide_control.csv"
glide_log_flush_interval_s: 1.0
glide_log_queue_size: 3000
