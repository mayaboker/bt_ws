# Whether an external pilot/controller is expected to provide manual input.
has_external_pilot: true

# FCU connection type. Use 1 for serial and 2 for ethernet.
drone_sink: 1

# Ethernet host/IP for the FCU when drone_sink is ethernet.
drone_eth_host: "127.0.0.1"

# Ethernet port for the FCU when drone_sink is ethernet.
drone_eth_port: 5761

# Serial device path for the FCU when drone_sink is serial.
drone_serial_port: "/dev/ttyUSB0"

# Ground control station MAVLink destination.
gcs_ip: "127.0.0.1"
gcs_port: 14550

# Optional non-blocking RC/state recorder.
rc_record_enabled: true
rc_record_path: "logs/rc_state.csv"
rc_record_flush_interval_s: 1.0
rc_record_queue_size: 1000

# Parameter YAML filename under bt_app/config.
config_name: "parameters.yaml"

# Diagnostic log verbosity. One of TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL.
log_level: "INFO"
