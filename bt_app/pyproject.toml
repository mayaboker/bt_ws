[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-app"
dynamic = ["version"]
description = "BT application services"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "click",
    "numpy",
    "opencv-python",
    "transitions",
    "pyserial",
    "pyyaml",
    "pyzmq",
    "msgpack",
    "pymavlink>=2.4.49",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "websockify",
]

[project.scripts]
bt-app = "bt_app.main:main"

bt-gz-camera = "bt_app.sensors.gz_camera:cli"
bt-optical-flow-tracker = "bt_app.trackers.optical_flow_tracker:main"
bt-gz-rtf = "bt_app.sensors.gz_rtf_monitor:main"
bt-msp-alt-hold = "bt_app.msp.alt_hold_test:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bt_app*", "joy_simulation*", "msp*"]

[tool.setuptools.dynamic]
version = { attr = "bt_app._version.__version__" }
