session_name: joy
windows:
  - window_name: joystick 
    layout: tiled
    suppress_history: false
    shell_command_before:
      - echo "before"
    panes:
      - shell_command:
          - printf '\033]2;%s\033\\' 'client'
          - printf 'check boxer model: usb-all-se'
          - bt-joy run -c output/boxer.yaml
      
