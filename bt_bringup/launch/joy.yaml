session_name: joy
windows:
  - window_name: joystick 
    layout: tiled
    suppress_history: false
    shell_command_before:
      - echo "before"
    panes:
      - shell_command: 
          - printf '\033]2;%s\033\\' 'server'
          - bt-joy-server run -c joy_config/server.yaml
        focus: true
      - shell_command:
          - printf '\033]2;%s\033\\' 'client'
          - bt-joy run -c joy_config/interlink.yaml
      
