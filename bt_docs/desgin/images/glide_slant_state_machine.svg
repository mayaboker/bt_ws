<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Slant intercept phase state machine</title><desc id="desc">Acquisition leads to tracking, terminal commit, or abort to altitude hold.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#285e8e"/></marker><style>.h{font:700 24px sans-serif}.t{font:700 18px sans-serif}.s{font:13px sans-serif;fill:#42505d}.b{fill:#eef5fc;stroke:#285e8e;stroke-width:2}.c{fill:#fff3e7;stroke:#bd6208;stroke-width:2}.x{fill:#f7eaea;stroke:#a52a2a;stroke-width:2}.l{stroke:#285e8e;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="430" fill="#fff"/><text x="35" y="45" class="h">Intercept phase state machine</text>
  <rect x="55" y="145" width="200" height="105" rx="14" class="b"/><text x="109" y="178" class="t">ACQUIRE</text><text x="78" y="205" class="s">hold position</text><text x="78" y="227" class="s">N valid centered frames</text>
  <rect x="355" y="145" width="200" height="105" rx="14" class="b"/><text x="422" y="178" class="t">TRACK</text><text x="379" y="205" class="s">update all controllers</text><text x="379" y="227" class="s">speed follows centering</text>
  <rect x="655" y="145" width="210" height="105" rx="14" class="c"/><text x="718" y="178" class="t">COMMIT</text><text x="681" y="205" class="s">freeze complete RC command</text><text x="681" y="227" class="s">wait for impact or timeout</text>
  <rect x="965" y="145" width="180" height="105" rx="14" class="x"/><text x="1003" y="178" class="t">TERMINAL</text><text x="986" y="205" class="s">physics contact or timeout</text><text x="995" y="227" class="s">classification deferred</text>
  <path d="M255 197h100" class="l"/><text x="270" y="184" class="s">lock count met</text><path d="M555 197h100" class="l"/><text x="568" y="184" class="s">centered + depth ≤ commit</text><path d="M865 197h100" class="l"/>
  <rect x="355" y="330" width="200" height="70" rx="14" class="x"/><text x="408" y="360" class="t">ALT_HOLD</text><text x="385" y="383" class="s">abort; explicit restart required</text><path d="M455 250v80" class="l"/><text x="468" y="292" class="s">stale or invalid track</text>
  <path d="M155 145V90h300v55" class="l"/><text x="220" y="80" class="s">invalid frame resets consecutive lock count</text>
</svg>
