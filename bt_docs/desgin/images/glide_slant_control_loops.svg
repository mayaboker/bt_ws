<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Visual intercept feedback loops</title><desc id="desc">Separate pitch, yaw, and thrust feedback paths converge into one RC command.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#285e8e"/></marker><style>.h{font:700 24px sans-serif}.t{font:15px sans-serif}.s{font:13px sans-serif;fill:#42505d}.b{fill:#eef5fc;stroke:#285e8e;stroke-width:2}.o{fill:#fff3e7;stroke:#bd6208;stroke-width:2}.l{stroke:#285e8e;stroke-width:2.5;fill:none;marker-end:url(#a)}.f{stroke:#777;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="35" y="42" class="h">Nested control loops</text>
  <text x="35" y="100" class="h">Pitch / forward speed</text><g class="b"><rect x="45" y="125" width="140" height="65" rx="9"/><rect x="245" y="125" width="190" height="65" rx="9"/><rect x="500" y="125" width="175" height="65" rx="9"/><rect x="745" y="125" width="150" height="65" rx="9"/></g><text x="70" y="163" class="t">vx command</text><text x="275" y="153" class="t">feedforward + PI</text><text x="270" y="176" class="s">anti-windup clamp</text><text x="530" y="163" class="t">pitch RC</text><text x="785" y="163" class="t">drone</text><path d="M185 157h60M435 157h65M675 157h70" class="l"/><rect x="745" y="225" width="150" height="60" rx="9" class="o"/><text x="767" y="250" class="t">visual depth rate</text><text x="782" y="272" class="s">vx measured</text><path d="M820 190v35" class="l"/><path d="M745 255H355v-65" class="f"/>
  <text x="35" y="345" class="h">Yaw / horizontal centering</text><g class="b"><rect x="45" y="370" width="140" height="60" rx="9"/><rect x="245" y="370" width="190" height="60" rx="9"/><rect x="500" y="370" width="175" height="60" rx="9"/></g><text x="91" y="406" class="t">ex</text><text x="278" y="396" class="t">deadband + K yaw</text><text x="286" y="417" class="s">bounded yaw rate</text><text x="540" y="406" class="t">yaw RC</text><path d="M185 400h60M435 400h65" class="l"/>
  <text x="35" y="505" class="h">Thrust / vertical speed</text><g class="b"><rect x="45" y="530" width="140" height="60" rx="9"/><rect x="245" y="530" width="190" height="60" rx="9"/><rect x="500" y="530" width="175" height="60" rx="9"/><rect x="745" y="530" width="150" height="60" rx="9"/></g><text x="70" y="566" class="t">vy geometry + ey</text><text x="291" y="566" class="t">velocity PI</text><text x="544" y="566" class="t">throttle RC</text><text x="784" y="566" class="t">drone</text><path d="M185 560h60M435 560h65M675 560h70" class="l"/><path d="M820 590v35H335v-35" class="f"/><text x="510" y="625" class="s">FCU vario feedback (upward positive)</text>
  <rect x="955" y="250" width="205" height="135" rx="12" class="o"/><text x="991" y="280" class="t">RC composition</text><text x="980" y="310" class="s">roll = center</text><text x="980" y="333" class="s">pitch = vx loop</text><text x="980" y="356" class="s">throttle = vy loop</text><text x="980" y="379" class="s">yaw = image loop</text><path d="M675 157c230 0 205 125 280 125M675 400c210 0 205-50 280-50M675 560c230 0 205-195 280-195" class="l"/>
</svg>
