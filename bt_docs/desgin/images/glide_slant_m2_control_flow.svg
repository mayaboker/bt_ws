<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="t d">
 <title id="t">Milestone 2 TRACK control flow</title><desc id="d">Visual observation and vario feed forward, vertical, and yaw loops which produce a typed command but remain flight gated.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.r{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:10}.x{font:15px sans-serif;fill:#0f172a}.h{font:bold 23px sans-serif;fill:#0f172a}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
 <text x="560" y="34" text-anchor="middle" class="h">Milestone 2 — isolated TRACK loops</text>
 <rect x="35" y="85" width="220" height="90" class="b"/><text x="145" y="122" text-anchor="middle" class="x">GlideObservation</text><text x="145" y="148" text-anchor="middle" class="x">depth • ex • ey • vx • vy</text>
 <rect x="330" y="65" width="250" height="105" class="b"/><text x="455" y="100" text-anchor="middle" class="x">Depth derivative</text><text x="455" y="126" text-anchor="middle" class="x">3-sample median + EMA</text><text x="455" y="150" text-anchor="middle" class="x">vx measured</text>
 <rect x="665" y="65" width="250" height="105" class="b"/><text x="790" y="100" text-anchor="middle" class="x">Pitch controller</text><text x="790" y="126" text-anchor="middle" class="x">feedforward + PI</text><text x="790" y="150" text-anchor="middle" class="x">bounded physical angle</text>
 <path d="M255 125H330M580 118H665" class="l"/>
 <rect x="330" y="235" width="250" height="105" class="b"/><text x="455" y="270" text-anchor="middle" class="x">Vertical controller</text><text x="455" y="296" text-anchor="middle" class="x">vy + image correction</text><text x="455" y="320" text-anchor="middle" class="x">fresh-vario PI</text>
 <rect x="35" y="255" width="220" height="65" class="b"/><text x="145" y="294" text-anchor="middle" class="x">MSP upward-positive vario</text><path d="M255 288H330" class="l"/><path d="M145 175V220H455V235" class="l"/>
 <rect x="330" y="405" width="250" height="85" class="b"/><text x="455" y="440" text-anchor="middle" class="x">Yaw controller</text><text x="455" y="466" text-anchor="middle" class="x">bounded K × deadband(ex)</text><path d="M145 175V447H330" class="l"/>
 <rect x="665" y="250" width="250" height="165" class="g"/><text x="790" y="285" text-anchor="middle" class="x">Betaflight RC mapper</text><text x="790" y="315" text-anchor="middle" class="x">pitch angle → RC</text><text x="790" y="342" text-anchor="middle" class="x">yaw rate → RC</text><text x="790" y="369" text-anchor="middle" class="x">hover + throttle correction</text><text x="790" y="396" text-anchor="middle" class="x">roll centered • ARM • ANGLE</text>
 <path d="M790 170V250M580 288H665M580 447H620V380H665" class="l"/>
 <rect x="665" y="480" width="250" height="90" class="g"/><text x="790" y="516" text-anchor="middle" class="x">GlideControlResult</text><text x="790" y="542" text-anchor="middle" class="x">frozen RC + diagnostics</text><path d="M790 415V480" class="l"/>
 <rect x="955" y="480" width="135" height="90" class="r"/><text x="1022" y="514" text-anchor="middle" class="x">Flight gate</text><text x="1022" y="540" text-anchor="middle" class="x">not dispatched</text><path d="M915 525H955" class="l"/>
</svg>
